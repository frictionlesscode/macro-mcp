[project]
name = "macro-mcp"
version = "0.1.0"
description = "Nutrition logging, macro-target tracking, and adherence trends, exposed to Claude over MCP"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "python-dotenv>=1.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
    "fastmcp",
    "Pillow>=10.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Pose-alignment for progress photos (body_photos.py). Optional and fairly heavy (~200MB+);
# its absence degrades to unaligned photos rather than breaking anything -- see
# body_photos.py's module docstring. Kept out of the base install so a host that can't get
# a working mediapipe wheel (e.g. some ARM boards) isn't blocked from running the server at
# all.
photos = [
    "mediapipe>=0.10.14",
    "numpy>=1.26",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises the real, running garmin-mcp instance (read-only), skipped by default; see tests/test_garmin_weight.py for the env vars that opt in.",
]
